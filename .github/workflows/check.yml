name: Check variant 2
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: dot -V && python -m unittest discover -s tests -v
      - run: python -m src -p A -t -r examples/repository.json -o output/demo.png
      - run: python -m pip install ruff==0.11.13 radon==6.0.1
      - run: ruff check --select E4,E7,E9,F,N,C901,E501 --line-length 80 src tests
      - name: Check complexity is at most ten
        run: |
          report=$(radon cc -s -n C src tests)
          printf '%s\n' "$report"
          test -z "$report"
